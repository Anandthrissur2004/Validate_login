<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="styles.css">
  <script src="validation.js" defer></script>
</head>
<body>
  <main class="form-card">
    <h1>Welcome back</h1>
    <p class="intro">Log in with your account details.</p>
    <form data-validate="login" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               aria-describedby="email-error">
        <span class="error" id="email-error" data-error-for="email" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               aria-describedby="password-error">
        <span class="error" id="password-error" data-error-for="password" aria-live="polite"></span>
      </div>
      <button type="submit">Log in</button>
      <p class="form-message" data-form-message role="status" aria-live="polite"></p>
    </form>
    <p class="switch-form">Need an account? <a href="registration.html">Register</a></p>
  </main>
</body>
</html>
