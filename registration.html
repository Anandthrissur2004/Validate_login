<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <link rel="stylesheet" href="styles.css">
  <script src="validation.js" defer></script>
</head>
<body>
  <main class="form-card">
    <h1>Create an account</h1>
    <p class="intro">Enter your details to register.</p>
    <form data-validate="registration" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required
               aria-describedby="name-error">
        <span class="error" id="name-error" data-error-for="name" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               aria-describedby="email-error">
        <span class="error" id="email-error" data-error-for="email" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required
               aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">Use at least 8 characters, including an uppercase letter, a lowercase letter, and a number.</p>
        <span class="error" id="password-error" data-error-for="password" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required
               aria-describedby="confirm-password-error">
        <span class="error" id="confirm-password-error" data-error-for="confirmPassword" aria-live="polite"></span>
      </div>
      <button type="submit">Register</button>
      <p class="form-message" data-form-message role="status" aria-live="polite"></p>
    </form>
    <p class="switch-form">Already registered? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
